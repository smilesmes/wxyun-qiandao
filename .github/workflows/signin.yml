name: 无限云盘每日签到

on:
  schedule:
    # UTC 00:10 = 北京时间 08:10（GitHub 的 cron 常有 5-15 分钟延迟，属正常现象）
    - cron: '10 0 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动点击运行

jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 执行签到
        env:
          WXY_ACCOUNT: ${{ secrets.WXY_ACCOUNT }}
          WXY_PASSWORD: ${{ secrets.WXY_PASSWORD }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: node index.js
